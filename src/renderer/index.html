<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:"
    />
    <title>Cushn</title>
    <style>
      /* First paint, before styles.css loads: main sets nativeTheme from the
         stored theme, so prefers-color-scheme matches it (src/main/theme.ts). */
      html {
        background: #f8fafe;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #090a0c;
        }
      }
    </style>
  </head>
  <body>
    <div id="root" class="h-full"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
