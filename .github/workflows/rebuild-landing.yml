name: Rebuild landing

# cushn.org/changelog is prerendered from changelog/ on main, so the site only shows a release
# after it's rebuilt. Publishing a release (by hand, after testing) starts a Workers Builds deploy
# of the landing's main branch through its deploy hook. Run it by hand to rebuild without a release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: rebuild-landing
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The hook's URL is its only credential: anyone holding it can start a build.
      - name: Trigger the landing's deploy hook
        env:
          HOOK: ${{ secrets.LANDING_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Missing repository secret LANDING_DEPLOY_HOOK: the qarjy-landing Worker's deploy hook URL (Settings > Builds > Deploy Hooks, branch main)."
            exit 1
          fi
          # A hook fired again before its build starts returns that build, so retrying is safe.
          curl -fsS --retry 3 --retry-all-errors -X POST "$HOOK"
          echo
