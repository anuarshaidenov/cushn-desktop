name: Release

# A `vX.Y.Z` tag builds, signs and notarizes both macOS archs and uploads them to a draft GitHub
# release, which is published by hand after testing. Run it by hand for a dry run: signed and
# notarized the same way, but it publishes nothing and keeps the builds as workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && 'always' || 'never' }}
    steps:
      - name: Check signing secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}. Refusing to build unsigned."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Read version
        run: echo "VERSION=$(node -p 'require("./package.json").version')" >> "$GITHUB_ENV"

      # electron-builder names the release `v` + package.json's version, whatever the tag says.
      - name: Check the tag matches package.json
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json's version $VERSION (expected v$VERSION)."
            exit 1
          fi
          if draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null) &&
            [ "$draft" = false ]; then
            echo "::error::Release $TAG is already published; bump the version for a new release."
            exit 1
          fi

      - run: xcodebuild -version
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      - name: Write the App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          (umask 077 && printf '%s\n' "$APPLE_API_KEY_P8" > "$key")
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"

      - run: pnpm build

      # electron-builder publishes each arch on its own, and both create the release when neither
      # finds one: two drafts with the files split between them. Both reuse a draft that exists.
      - name: Create the draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "$VERSION" --notes "" --verify-tag
          fi

      - name: Package, sign and notarize
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec electron-builder --mac --arm64 --x64 --publish "$PUBLISH" -c.forceCodeSigning=true

      - name: Verify signatures, notarization and the packaged apps
        run: |
          shopt -s nullglob
          apps=(release/"$VERSION"/mac*/Cushn.app)
          if [ ${#apps[@]} -ne 2 ]; then
            echo "::error::Expected 2 apps under release/$VERSION, found ${#apps[@]}."
            exit 1
          fi
          for app in "${apps[@]}"; do
            echo "::group::$app"
            codesign --verify --deep --strict --verbose=2 "$app"
            assessment=$(spctl --assess --type execute --verbose=4 "$app" 2>&1)
            echo "$assessment"
            if ! grep -q "source=Notarized Developer ID" <<< "$assessment"; then
              echo "::error::$app is not accepted as a notarized Developer ID app."
              exit 1
            fi
            xcrun stapler validate "$app"
            .github/scripts/smoke-test-mac.sh "$app"
            echo "::endgroup::"
          done
          feed="release/$VERSION/latest-mac.yml"
          cat "$feed"
          grep -q -- "-$VERSION-arm64-mac.zip" "$feed"
          grep -q -- "-$VERSION-mac.zip" "$feed"

      - name: Set the release notes
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          awk 'NR == 1 && /^---[ \t]*\r?$/ { fm = 1; next } fm && /^---[ \t]*\r?$/ { fm = 0; next } !fm' \
            "changelog/$VERSION.md" | sed '/./,$!d' > "$notes"
          if [ ! -s "$notes" ]; then
            echo "::error::changelog/$VERSION.md has no notes after its frontmatter."
            exit 1
          fi
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != true ]; then
            echo "::error::Expected a draft release for $TAG."
            exit 1
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: cushn-${{ env.VERSION }}-signed-${{ github.sha }}
          path: |
            release/${{ env.VERSION }}/*.dmg
            release/${{ env.VERSION }}/*.zip
            release/${{ env.VERSION }}/latest-mac.yml
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
